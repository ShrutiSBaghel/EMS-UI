<form class="employee-form" #employeeForm="ngForm" (ngSubmit)="submit()">
  <label class="form-field" for="name">
    <span>Name</span>
    <input
      pInputText
      id="name"
      name="name"
      type="text"
      [(ngModel)]="name"
      required
    />
  </label>

  <label class="form-field" for="department">
    <span>Department</span>
    <input
      pInputText
      id="department"
      name="department"
      type="text"
      [(ngModel)]="department"
      required
    />
  </label>

  <div class="form-actions">
    <button
      pButton
      type="button"
      label="Cancel"
      severity="secondary"
      [outlined]="true"
      (click)="cancel()"
    ></button>
    <button
      pButton
      type="submit"
      label="Add Employee"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="employeeForm.invalid || saving()"
    ></button>
  </div>
</form>
